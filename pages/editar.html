<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar livro - Minha Estante</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="cabecalho">
    <div class="cabecalho-conteudo">
      <div class="logo">
        <h1>Minha Estante</h1>
        <p>Organize os livros que você tem, está lendo ou quer ler.</p>
      </div>
      <nav class="menu">
        <ul>
          <li><a href="../index.html">Início</a></li>
          <li><a href="livros.html" class="ativo">Meus livros</a></li>
          <li><a href="cadastro.html">Cadastrar livro</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Editar livro</h2>

    <section class="caixa" id="area-edicao">
      <h3 id="titulo-edicao">Carregando...</h3>
      <p class="aviso-obrigatorio">Campos com * são obrigatórios.</p>

      <!-- Lista de erros da validação (preenchida pelo JavaScript) -->
      <div id="erros" class="mensagem erro" hidden></div>

      <!-- Os campos são preenchidos pelo JavaScript (editar.js) com os dados salvos -->
      <form id="form-editar" class="formulario" novalidate>
        <div class="campo">
          <label for="titulo">Título *</label>
          <input type="text" id="titulo" name="titulo" required>
        </div>

        <div class="campo">
          <label for="autor">Autor *</label>
          <input type="text" id="autor" name="autor" required>
        </div>

        <div class="campo">
          <label for="categoria">Categoria *</label>
          <select id="categoria" name="categoria" required>
            <option value="">Selecione</option>
            <option value="romance">Romance</option>
            <option value="contos">Contos</option>
            <option value="ensaio">Ensaio</option>
            <option value="poesia">Poesia</option>
            <option value="biografia">Biografia</option>
            <option value="historia">História</option>
            <option value="fantasia">Fantasia</option>
            <option value="outros">Outros</option>
          </select>
        </div>

        <div class="campo">
          <label for="ano">Ano</label>
          <input type="number" id="ano" name="ano" min="1000" max="2026">
        </div>

        <div class="campo">
          <label for="paginas">Número de páginas</label>
          <input type="number" id="paginas" name="paginas" min="1">
        </div>

        <div class="campo">
          <label for="capa">Link da capa</label>
          <input type="url" id="capa" name="capa" placeholder="https://...">
        </div>

        <fieldset class="campo-inteiro">
          <legend>Status de leitura *</legend>
          <div class="opcoes">
            <div class="opcao">
              <input type="radio" id="quero-ler" name="status" value="quero-ler">
              <label for="quero-ler">Quero ler</label>
            </div>
            <div class="opcao">
              <input type="radio" id="lendo" name="status" value="lendo">
              <label for="lendo">Lendo</label>
            </div>
            <div class="opcao">
              <input type="radio" id="lido" name="status" value="lido">
              <label for="lido">Lido</label>
            </div>
          </div>
        </fieldset>

        <div class="campo">
          <label for="nota">Nota</label>
          <select id="nota" name="nota">
            <option value="">Sem nota</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>

        <div class="campo">
          <label for="data">Terminei de ler em</label>
          <input type="date" id="data" name="data">
        </div>

        <div class="opcao campo-inteiro">
          <input type="checkbox" id="favorito" name="favorito">
          <label for="favorito">Marcar como favorito</label>
        </div>

        <div class="campo campo-inteiro">
          <label for="observacoes">Observações</label>
          <textarea id="observacoes" name="observacoes" rows="4"></textarea>
        </div>

        <div class="botoes campo-inteiro">
          <button type="submit" class="botao">Salvar alterações</button>
          <a href="detalhes.html" class="botao botao-secundario" id="link-cancelar">Cancelar</a>
        </div>
      </form>
    </section>

    <!-- Aparece se o id do endereço não existir -->
    <p id="nao-encontrado" class="mensagem erro" hidden>Livro não encontrado. <a href="livros.html">Voltar para a lista</a></p>
  </main>

  <footer class="rodape">
    <p>Minha Estante - 2026 - Feito por Wyatt</p>
  </footer>
  <script src="../assets/js/script.js"></script>
  <script src="../assets/js/editar.js"></script>
</body>
</html>
