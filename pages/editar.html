<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar livro - Minha Estante</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header>
    <h1>Minha Estante</h1>
    <p>Organize os livros que você tem, está lendo ou quer ler.</p>
    <nav>
      <ul>
        <li><a href="../index.html">Início</a></li>
        <li><a href="livros.html">Meus livros</a></li>
        <li><a href="cadastro.html">Cadastrar livro</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Editar livro</h2>

    <form>
      <p>
        <label for="titulo">Título:</label>
        <input type="text" id="titulo" name="titulo" value="Dom Casmurro" required>
      </p>

      <p>
        <label for="autor">Autor:</label>
        <input type="text" id="autor" name="autor" value="Machado de Assis" required>
      </p>

      <p>
        <label for="categoria">Categoria:</label>
        <select id="categoria" name="categoria" required>
          <option value="">Selecione</option>
          <option value="romance" selected>Romance</option>
          <option value="fantasia">Fantasia</option>
          <option value="ficcao-cientifica">Ficção científica</option>
          <option value="distopia">Distopia</option>
          <option value="historia">História</option>
          <option value="outros">Outros</option>
        </select>
      </p>

      <p>
        <label for="ano">Ano:</label>
        <input type="number" id="ano" name="ano" value="1899" min="1000" max="2026">
      </p>

      <p>
        <label for="paginas">Número de páginas:</label>
        <input type="number" id="paginas" name="paginas" value="256" min="1">
      </p>

      <p>
        <label for="capa">Link da capa:</label>
        <input type="url" id="capa" name="capa" placeholder="https://...">
      </p>

      <fieldset>
        <legend>Status de leitura</legend>
        <input type="radio" id="quero-ler" name="status" value="quero-ler">
        <label for="quero-ler">Quero ler</label>
        <input type="radio" id="lendo" name="status" value="lendo">
        <label for="lendo">Lendo</label>
        <input type="radio" id="lido" name="status" value="lido" checked>
        <label for="lido">Lido</label>
      </fieldset>

      <p>
        <label for="nota">Nota:</label>
        <select id="nota" name="nota">
          <option value="">Sem nota</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5" selected>5</option>
        </select>
      </p>

      <p>
        <label for="data">Terminei de ler em:</label>
        <input type="date" id="data" name="data" value="2026-03-15">
      </p>

      <p>
        <input type="checkbox" id="favorito" name="favorito" checked>
        <label for="favorito">Favorito</label>
      </p>

      <p>
        <label for="observacoes">Observações:</label><br>
        <textarea id="observacoes" name="observacoes" rows="4" cols="40">Li para a aula de literatura. Gostei muito do final e fiquei na dúvida sobre a Capitu.</textarea>
      </p>

      <button type="submit">Salvar alterações</button>
      <a href="detalhes.html">Cancelar</a>
    </form>
  </main>

  <footer>
    <p>Minha Estante - 2026 - Feito por Wyatt</p>
  </footer>
</body>
</html>
