<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus livros - Minha Estante</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="cabecalho">
    <div class="cabecalho-conteudo">
      <div class="logo">
        <h1>Minha Estante</h1>
        <p>Organize os livros que você tem, está lendo ou quer ler.</p>
      </div>
      <nav class="menu">
        <ul>
          <li><a href="../index.html">Início</a></li>
          <li><a href="livros.html" class="ativo">Meus livros</a></li>
          <li><a href="cadastro.html">Cadastrar livro</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="titulo-pagina">
      <h2>Meus livros</h2>
      <a href="cadastro.html" class="botao">+ Cadastrar livro</a>
    </div>

    <!-- Mensagem de aviso (aparece depois de cadastrar, editar ou excluir) -->
    <p id="mensagem" class="mensagem sucesso" hidden></p>

    <!-- Pesquisa, filtro e ordenação -->
    <section class="caixa">
      <h3>Pesquisar</h3>
      <form class="filtros">
        <div class="campo campo-pesquisa">
          <label for="pesquisa">Título ou autor</label>
          <input type="search" id="pesquisa" name="pesquisa" placeholder="Digite o título ou o autor">
        </div>

        <div class="campo">
          <label for="filtro-status">Status</label>
          <select id="filtro-status" name="status">
            <option value="todos">Todos</option>
            <option value="quero-ler">Quero ler</option>
            <option value="lendo">Lendo</option>
            <option value="lido">Lido</option>
          </select>
        </div>

        <div class="campo">
          <label for="filtro-categoria">Categoria</label>
          <select id="filtro-categoria" name="categoria">
            <option value="todas">Todas</option>
            <option value="romance">Romance</option>
            <option value="contos">Contos</option>
            <option value="ensaio">Ensaio</option>
            <option value="poesia">Poesia</option>
            <option value="biografia">Biografia</option>
            <option value="historia">História</option>
            <option value="fantasia">Fantasia</option>
            <option value="outros">Outros</option>
          </select>
        </div>

        <div class="campo">
          <label for="ordenar">Ordenar por</label>
          <select id="ordenar" name="ordenar">
            <option value="titulo">Título (A-Z)</option>
            <option value="autor">Autor (A-Z)</option>
            <option value="ano">Ano</option>
            <option value="nota">Nota</option>
          </select>
        </div>

        <button type="submit" class="botao">Pesquisar</button>
      </form>
    </section>

    <!-- Lista de livros -->
    <section class="caixa">
      <h3>Livros cadastrados</h3>
      <p id="contador" class="contador"></p>

      <div class="tabela-container">
        <table class="tabela-livros">
          <thead>
            <tr>
              <th>Capa</th>
              <th>Título</th>
              <th>Autor</th>
              <th>Categoria</th>
              <th>Ano</th>
              <th>Status</th>
              <th>Nota</th>
              <th>Ações</th>
            </tr>
          </thead>
          <!-- As linhas são criadas pelo JavaScript (livros.js) -->
          <tbody id="lista-livros"></tbody>
        </table>
      </div>

      <p id="lista-vazia" class="mensagem info" hidden>Nenhum livro encontrado.</p>
    </section>
  </main>

  <footer class="rodape">
    <p>Minha Estante - 2026 - Feito por Wyatt</p>
  </footer>
  <script src="../assets/js/script.js"></script>
  <script src="../assets/js/livros.js"></script>
</body>
</html>
